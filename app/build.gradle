plugins { id 'com.android.application' }
android {
    namespace 'com.android.killapps'
    compileSdk 35
    defaultConfig {
        applicationId 'com.android.killapps'; minSdk 26; targetSdk 35; versionCode 2; versionName '1.0.1'
        manifestPlaceholders = [appLabel: '@string/app_name', accessibilityLabel: '@string/accessibility_label']
    }
    splits {
        abi {
            enable true
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }
    buildTypes {
        debug {
            if (project.hasProperty('diagnostic')) {
                applicationIdSuffix '.diagnostic'
                manifestPlaceholders = [appLabel: '@string/diagnostic_app_name', accessibilityLabel: '@string/diagnostic_accessibility_label']
            }
        }
        release {
            // Installable builds without repository secrets. Replace with a private release key for stable upgrades.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    bundle { language { enableSplit = false } }
}
dependencies {
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
}
